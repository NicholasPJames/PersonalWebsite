<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Loading… — Nick James</title>
    <link href="https://fonts.googleapis.com/css2?family=GFS+Didot&display=swap" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/gh/aaaakshat/cm-web-fonts@latest/font/Typewriter/cmun-typewriter.css" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css?v=6" />
    <script>
      // GitHub Pages serves this file for any unknown URL.
      //
      // For paths like /p/<id>.html (a freshly published post whose static
      // page hasn't been rebuilt yet by the GitHub Action), redirect the
      // visitor to the dynamic /blog-post.html?id=<id> page so the post
      // loads immediately. Everything else falls through to a real 404.
      (function () {
        const m = window.location.pathname.match(/^\/p\/([^\/]+?)\.html$/);
        if (m) {
          const id = decodeURIComponent(m[1]);
          window.location.replace('/blog-post.html?id=' + encodeURIComponent(id));
        }
      })();
    </script>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <filter id="ink" x="-1%" y="-1%" width="102%" height="102%" color-interpolation-filters="sRGB">
        <feGaussianBlur stdDeviation=".45" />
        <feComponentTransfer>
          <feFuncA type="linear" slope="2.6" intercept="-.35" />
        </feComponentTransfer>
      </filter>
    </svg>
    <nav class="nav">
      <a href="/index.html" class="nav-name" style="border:none;">Nick James</a>
      <div class="nav-links">
        <a href="/index.html">Home</a>
        <a href="/blog.html">Blog</a>
        <a href="/bookshelf.html">Bookshelf</a>
      </div>
    </nav>

    <main class="post-wrap">
      <h1 class="post-title">Page not found</h1>
      <p class="muted-text">
        The page you're looking for doesn't exist. Try heading
        <a href="/index.html">home</a> or browsing the
        <a href="/blog.html">blog</a>.
      </p>
    </main>
  </body>
</html>
