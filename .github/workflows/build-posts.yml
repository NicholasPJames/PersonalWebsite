name: Build post preview pages

# Regenerates /p/<id>.html for each published post so iMessage/Twitter/etc.
# show real titles and descriptions in link previews.

on:
  push:
    branches: [main]
  schedule:
    # Every 30 minutes — picks up new posts published via the admin tool.
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate post preview pages
        run: node scripts/build-posts.js

      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "build: regenerate post preview pages"
            git push
          fi
